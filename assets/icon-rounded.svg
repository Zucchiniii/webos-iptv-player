<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 512 512">
  <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  <g clip-path="url(#tile)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6bff"/>
      <stop offset=".52" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#22c8ff"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".2" cy=".08" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx=".9" cy="1.05" r=".85">
      <stop offset="0" stop-color="#12093f" stop-opacity=".42"/>
      <stop offset="1" stop-color="#12093f" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#10073a" flood-opacity=".38"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ff3d68" flood-opacity=".75"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shade)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>
  <path d="M204 176 L204 336 L344 256 Z" fill="#fff" stroke="#fff" stroke-width="76"
        stroke-linejoin="round" filter="url(#lift)"/>
  <circle cx="390" cy="122" r="44" fill="#ff3d68" stroke="#fff" stroke-width="16" filter="url(#glow)"/>
</g>
</svg>
